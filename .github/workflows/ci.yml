name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # A real PostgreSQL for the integration suite. Tests never mock Prisma; the
    # bugs that matter (org scoping, the reservation exclusion constraint,
    # derived invoice balances) only exist in the query the database runs.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hosni_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Consumed by the integration vitest config's globalSetup (prisma migrate
      # deploy) and by the Prisma client the tests share.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hosni_test?schema=public
      # Prisma reads DATABASE_URL for `migrate deploy` / `generate`.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hosni_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # The backend and frontend import @hosni/shared from its built dist, and
      # the backend imports the generated Prisma client — both must exist before
      # typecheck, tests, or build run.
      - name: Build shared package
        run: npm run build --workspace packages/shared

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace backend

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (unit)
        run: npm run test

      - name: Test (integration, with Postgres)
        run: npm run test:integration --workspace backend

      - name: Build
        run: npm run build

  # Builds and smoke-tests the deployment artifact — the Docker images — in
  # parallel with build-and-test. The frontend crash-loop lived in the gap
  # between `npm run build` and `docker build`, which nothing else covers.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Both images build from the repo root: the shared workspace and the
      # lockfile live there.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: hosni-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          tags: hosni-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: nginx config is valid
        run: docker run --rm hosni-web:ci nginx -t
      # The guard that keeps the deleted design deleted: the static image must
      # contain no reverse proxy. A reintroduced proxy_pass fails the build.
      - name: web image has no /api proxy
        run: |
          count=$(docker run --rm hosni-web:ci grep -c proxy_pass /etc/nginx/conf.d/default.conf || true)
          echo "proxy_pass occurrences: $count"
          test "$count" = "0"
      # The exact production symptom, reproduced: the SPA must serve with no API
      # in existence and no upstream to resolve.
      - name: web container serves with no API anywhere
        run: |
          docker run -d --name web-ci -p 8088:80 hosni-web:ci
          sleep 5
          test "$(docker inspect -f '{{.State.Running}}' web-ci)" = "true" \
            || { docker logs web-ci; exit 1; }
          code=$(curl -sf -o /dev/null -w '%{http_code}' http://localhost:8088/) \
            || { docker logs web-ci; exit 1; }
          echo "GET / -> $code"
          test "$code" = "200"
          docker rm -f web-ci
      - name: Compose file is valid
        run: docker compose -f docker-compose.prod.yml config -q
        env:
          POSTGRES_PASSWORD: ci
          DATABASE_URL: postgresql://postgres:ci@postgres:5432/hosni
          REDIS_URL: redis://redis:6379
          JWT_ACCESS_SECRET: ci-secret-that-is-at-least-32-characters
          JWT_REFRESH_SECRET: ci-other-secret-at-least-32-characters
          CORS_ORIGIN: http://localhost
