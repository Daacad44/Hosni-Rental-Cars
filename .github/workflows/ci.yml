name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # A real PostgreSQL for the integration suite. Tests never mock Prisma; the
    # bugs that matter (org scoping, the reservation exclusion constraint,
    # derived invoice balances) only exist in the query the database runs.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hosni_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Consumed by the integration vitest config's globalSetup (prisma migrate
      # deploy) and by the Prisma client the tests share.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hosni_test?schema=public
      # Prisma reads DATABASE_URL for `migrate deploy` / `generate`.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hosni_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # The backend and frontend import @hosni/shared from its built dist, and
      # the backend imports the generated Prisma client — both must exist before
      # typecheck, tests, or build run.
      - name: Build shared package
        run: npm run build --workspace packages/shared

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace backend

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (unit)
        run: npm run test

      - name: Test (integration, with Postgres)
        run: npm run test:integration --workspace backend

      - name: Build
        run: npm run build
