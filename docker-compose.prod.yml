# Production stack for a single VPS behind a reverse proxy.
# Secrets come from a .env file next to this compose (never committed).
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hosni}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  # Applies pending migrations once, then exits. api/worker wait for it.
  migrate:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ['npx', 'prisma', 'migrate', 'deploy']
    working_dir: /app/backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    # Published on its own origin now that nginx no longer proxies /api. The SPA
    # (served on localhost:80) calls the API on localhost:4000 directly.
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      # Where the SPA is served; defaults to match the web service below.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Absolute URL to the API's published port. localhost:80 (web) and
        # localhost:4000 (api) are same-site, so the httpOnly/sameSite=lax
        # refresh cookie flows here exactly as it does across subdomains in prod.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000/api/v1}
    restart: unless-stopped
    ports:
      - '80:80'

volumes:
  pgdata:
  redisdata:
