server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The SPA calls the API on its own domain (baked into the bundle via
  # VITE_API_BASE_URL) — there is deliberately no /api proxy here. A static-file
  # container has no upstream, so it cannot fail to resolve one and crash-loop.
  # Do not reintroduce a reverse proxy; that coupling is what took the site down.

  # Cache built assets aggressively; they are content-hashed by Vite.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback: every non-file route serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
