# SPA static serving for the unprivileged nginx image (listens on :8080).
# TLS and host routing are done by the reverse proxy in front of this.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip text assets; images/fonts are already compressed.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: every unknown path falls back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or a deploy won't be picked up.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Basic hardening headers (the reverse proxy adds HSTS on the TLS edge).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
