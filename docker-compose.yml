# Local development dependencies. Application containers for the single-VPS
# deploy are defined separately; this brings up the datastores only.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hosni
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Dedicated database for the integration test suite. Kept separate from the
  # dev `postgres` service (different port, tmpfs storage) so a test run — which
  # truncates every table between tests — can never touch development data.
  # Point the suite at it with:
  #   TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5433/hosni_test?schema=public
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hosni_test
    ports:
      - '5433:5432'
    # Ephemeral: the test database never needs to survive a restart.
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  pgdata:
